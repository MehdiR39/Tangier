# Tests automatiques : a chaque envoi (push) et chaque demande de fusion, la suite complete tourne
# sur un Python neuf, avec seulement les fichiers de git et les dependances de requirements-intel.txt
# -- exactement comme l image de la prod (Dockerfile.intel). Simule le 27/09/2026 : tout vert.
# Aucun secret n est utilise : les tests ne touchent ni a la cle, ni a la chaine, ni a Telegram.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-intel.txt
      - run: pip install -r requirements-intel.txt
      - run: python -m pytest -q -p no:cacheprovider tests/intel_tests
