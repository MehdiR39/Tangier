# Tangier Intel tunables. Deep-merged over intel/settings.py DEFAULT_CONFIG.
# Secrets and endpoints are NOT here: see .env (INTEL_* variables, README_INTEL.md).

portfolio:
  positions:
    # Tokens are configured by CONTRACT ADDRESS only. quantity / cost_basis_usd / entry_ts
    # are optional and only used for PnL context in alerts (null = unknown).
    - address: "0xd18528b39da6464b3662c331a52181ecb15b1e18"
      label: SAYLORMOON
      quantity: null
      cost_basis_usd: null
      entry_ts: null
    - address: "0xaa0b48defde440b8445ba45db88cb076cf261e18"
      label: TAIWAN
      quantity: null
      cost_basis_usd: null
      entry_ts: null
    - address: "0x6b1d42927b1a84ec28fa88d4fc6fa7af404966be"
      label: PAIR
      quantity: null
      cost_basis_usd: null
      entry_ts: null

engine:
  portfolio_cycle_seconds: 60
  # These tokens are tradeable for a median of six minutes, so the cycle length is what decides
  # how late a decision arrives. An evaluation costs 2.9 s since migration 6 — capacity is no
  # longer the constraint, the appointment is.
  scanner_cycle_seconds: 60
  scanner_deep_cycle_seconds: 120

scoring:
  # Derived from measurement on 2026-09-04, not from judgement: 3 942 evaluations paired with the
  # price 24 h later, weights chosen on the first half of the period and confirmed on the second.
  # Top quartile doubled 11.7 % of the time against a 3.8 % base rate; the previous weighting
  # (asymmetry .30 / traction .25 / survival .20 / distribution .15 / narrative .10) scored 1.0 %,
  # worse than picking at random. asymmetry and narrative are gone: both measured as harmful.
  # These keys REPLACE the defaults, they are not merged with them.
  weights:
    organic_volume: 0.35
    distribution: 0.30
    smart_money: 0.15
    traction: 0.10
    survival: 0.10

hard_filters:
  min_liquidity_usd: 20000
  min_liquidity_to_mc: 0.03
  liquidity_to_mc_reject_min_age_hours: 24
  max_top10_excluded_system_pct: 0.50
  max_insider_cluster_pct: 0.40
  asymmetry_penalty_x_from_fmm: 50

first_meaningful_market:
  bucket_seconds: 300
  min_unique_traders: 25
  min_trades: 50
  min_cum_quote_inflow_usd: 10000
  min_liquidity_usd: 20000
  persistence_buckets: 3

scanner:
  moonshot_alert_threshold: 70
  stage1:
    max_age_hours: 336
    min_liquidity_usd: 20000
    max_market_cap_usd: 5000000
    min_volume_24h_usd: 5000
  stage3:
    # public RPC: keep the first pass of a new candidate short (~8h of history) so new gems
    # are scored within minutes; the history loop completes older history afterwards.
    # Slots go to never-scored candidates with the strongest momentum (2026-09-03 lesson:
    # the queue was monopolised by already-scored tokens and a ×7 was never analysed).
    # 5 per cycle was sized for an evaluation that cost 355 s. It costs 2.9 s since the covering
    # indexes of migration 6 (2026-09-05), so the 4-minute cycle budget is the real limit now.
    max_candidates_per_cycle: 60
    refresh_per_cycle: 5
    backfill_blocks: 300000

alerts:
  enabled: true
  min_severity: WATCH
  lp_drop_pct: 0.15
  # 30k, pas 100k : une ligne de 20 € ne déplace un pool de 37 k$ que de 0,06 %.
  scanner_min_liquidity_usd: 30000

states:
  candidate_min_liquidity_usd: 30000

decisions:
  enabled: true
  size_eur: 20
  min_moonshot_buy: 70

# T+1 watcher — switched ON by the operator on 2026-09-06 ("Active oui"). It writes BUY decisions
# of 5 EUR when a pool has >= 27 swaps in the minute after its first trade (the one entry rule that
# held out of sample). The execution section stays dry_run: nothing leaves the wallet until
# execution.mode is deliberately set to live, separately.
t1:
  enabled: true
  # Experience bornee, decidee avec l operateur le 2026-09-07 : vingt tickets de 5 EUR, soit
  # 100 EUR de risque, pour repondre a une seule question. Le bug d arrondi corrige ce soir
  # faisait echouer des ventes parfaitement possibles ; il reste a savoir si, une fois corrige,
  # la vente passe DANS la fenetre de sortie. Si le taux d invendables tombe sous 15 %, la regle
  # tient ; s il reste au-dessus de 40 %, Robinhood s arrete. Le moteur se coupe tout seul au
  # budget, sans dependre de quelqu un qui surveille l heure.
  buy_budget: 10
  budget_since_ts: 1788869200
  # Confirmation en deuxieme minute, ajoutee le 2026-09-08 apres cinq tickets invendables d affilee
  # (-25,32 EUR, aucune vente aboutie). Le diagnostic : on n achetait pas des pieges mais des pools
  # deja finis -- mediane de 12 echanges apres notre achat sur les lignes invendables, contre 296
  # sur les lignes vendues, et rien a T+1 ne separait les deux.
  # Mesure sur 1 365 pools suivis minute par minute : parmi ceux qui passent la barre 27-60, exiger
  # 30 echanges pendant la DEUXIEME minute garde 257 pools dont 0 % s arretent, et ecarte 64 pools
  # dont 72 % s arretent. C est le seul filtre teste qui vise ce defaut precis.
  # Le prix : une minute de retard, donc une entree plus haute sur les pools qui montent. Le
  # simulateur ne peut pas l arbitrer honnetement (il annonce 82 % de gagnants a T+1 la ou le
  # carnet reel perdait avec 46 % d invendables), seule une serie reelle le dira.
  # Mettre 0 pour revenir a l achat immediat a T+1.
  confirm_minute2: 30
  # Plafond sur le compteur d entree, ajoute le 2026-09-07 apres une journee reelle perdante.
  # Au-dela de 60 echanges dans la premiere minute, le pool est un bundle qui retire sa liquidite
  # aussitot : sur 84 pools ETH que ce livre n a PAS achetes (donc sans effet de notre part),
  # 77 % de ceux sous 60 echanges vivaient encore cinq minutes apres, contre 11 % au-dessus.
  # Nos propres achats du jour : 6 sous le plafond +57,82 EUR, 13 au-dessus -59,22 EUR.
  # L historique des 45 jours precedents disait l inverse : c est une tactique qui a change,
  # pas une loi. Mettre 0 pour retirer le plafond.
  max_trades: 60

# 2026-09-07: les pools cotes en USDG perdent (historique -6 EUR sur 5, carnet reel -73 EUR sur 42,
# 24 % de gagnants) la ou les pools ETH gagnent (+159 EUR sur 106). On n achete que les pools ETH.
# Le passage en reel se fait ici: mode: live (et la cle dans .env). Les deux sont necessaires.
execution:
  # live depuis le 2026-09-07 sur ordre de l'operateur ("lance tout"), portefeuille 0x2a33086d...c908
  # verifie (0.186 ETH). Plafonds inchanges: 25 EUR/ordre, 40 ordres et 200 EUR/jour, 5 % slippage.
  mode: live
  cycle_seconds: 5          # une decision T+1 vaut des secondes: 30 s d attente coutait le debut de la pompe
  # Il y a DEUX deploiements Uniswap v4 sur cette chaine. Le routeur par defaut (0xf8b30c1b...) sert le
  # PoolManager 0xe5a881e6..., pas le notre (0x8366a39c...): les 5 premiers achats reels du 2026-09-07
  # ont tous echoue a l estimation (PoolNotInitialized). Celui-ci est le routeur que les bots utilisent
  # sur nos pools (164 000 swaps/24 h), poolManager() = 0x8366a39c..., simulation OK avec et sans hook.
  router: "0x8876789976decbfcbbbe364623c63652db8c0904"
  # Ce que le pool rend en moins par rapport a la cotation calculee (taxe du token/hook a l achat).
  # Mesure le 2026-09-07 sur 90 issues (simulation rejouee + livre reel) : l esperance par ticket
  # de 5 EUR vaut +1,30 EUR a 10 % de taxe, +0,60 EUR a 20 %, +0,25 EUR a 25 %, et devient negative
  # vers 28 %. Le plafond de 10 % refusait donc des achats encore rentables ; 20 % garde huit points
  # de marge sous le point mort, mesure sur une seule journee.
  max_hook_tax_pct: 20
  allowed_quotes:
    - "0x0000000000000000000000000000000000000000"

# Livre Solana, active a blanc le 2026-09-07. Il decouvre les lancements, mesure leur premiere
# minute par transaction (ce que Robinhood ne permettait pas : le champ expediteur y donne le
# routeur pour 98 % des echanges), et applique la meme sortie x2 ou T+5 min.
#
# Les seuils sont volontairement NON calibres : min_buyers a 0 n achete rien. Les seuils de
# Robinhood (27 a 60 echanges) n ont aucun sens ici, ou les premieres mesures donnent 186 a 2 834
# echanges dans la premiere minute. Ils seront fixes sur les donnees de cette nuit, pas au jugement.
#
# Passer en reel demande deux gestes separes, comme sur l autre chaine : une cle dans
# SOLANA_PRIVATE_KEY, et mode: live ci-dessous. Aucun portefeuille Solana n existe a ce jour.
solana:
  enabled: true
  # Reglage tire de 235 lancements observes sur 12 h (intel/research/solana_backtest.py).
  # Le signal : les echanges par acheteur dans la premiere minute. Sous 15, on gagne ; au-dessus,
  # on perd, et c est la que se trouve la moitie des lancements. Le plateau entre 5 et 15 rend le
  # seuil peu sensible a sa valeur exacte, ce qui vaut mieux qu un pic.
  #   <= 5 : +0,67 EUR/ticket · <= 10 : +0,69 · <= 15 : +0,68 · <= 25 : +0,53 · <= 40 : +0,42
  # Sortie x2 ou T+15. Le balayage des durees a un sommet net a un quart d heure, et il gagne sur
  # les quatre criteres a la fois -- rendement +1,06 EUR/ticket, 61 % de gagnants, quasi identique
  # sur les deux moities de la periode (+1,08 puis +1,04), et 80 % du gain subsiste apres retrait
  # des cinq meilleures lignes. Au-dela la degradation est reguliere : +0,64 a une heure, +0,37 a
  # deux heures, et la robustesse tombe a 42 %, signe que le gain restant tient dans quelques coups
  # rares. En deca, T+5 ne rend que +0,72. Les donnees couvrent ces durees : 211 lignes sur 237
  # sont suivies au moins une heure apres l entree.
  # Ecarter pump.fun ne change rien (+0,68 dans les deux cas) : filtre inutile, on le garde.
  # live depuis le 2026-09-08. Portefeuille dedie HY4wrwep...ZfyL, alimente a 0,5 SOL : MetaMask
  # n exporte pas la cle privee Solana, seulement celle des chaines EVM, donc le bot ne peut pas
  # travailler sur le compte de l operateur et dispose du sien. Il ne risque que ce qu on y met.
  mode: live
  # Ticket porte a 20 EUR le 2026-09-08. Le cout de la taille, mesure en cotant toutes les tailles
  # au meme instant sur les pools reellement achetes, est lineaire et minuscule : 0,12 % a 10 EUR,
  # 0,37 % a 20, 1,10 % a 50. La taille n est donc pas le frein, le portefeuille l est -- 98 EUR,
  # soit quatre tickets simultanes, d ou le plafond de positions ouvertes.
  size_eur: 20.0
  max_open_positions: 4
  # Plancher releve de 5 a 125 le 2026-09-08, decide avec l operateur. Mesure sur les 254
  # lancements observes : +0,45 EUR par euro engage et 73 % de gagnants au-dessus de 125 acheteurs
  # distincts, contre +0,24 et 65 % au-dessus de 5. Trois verifications avant d y toucher :
  #   - le plancher ameliore les SEPT regles de sortie testees, pas seulement celle en production,
  #     donc il ne tient pas a un couple de parametres ;
  #   - au-dessus de 125 acheteurs aucun lancement ne depasse 15 echanges par acheteur : le
  #     plancher englobe le filtre anti-bundle, qui reste en place par prudence ;
  #   - il laisse 1,2 occasion par heure en direct, contre 4,3 avant : reduit, jamais affame.
  # Sur les cinq achats reels du 08/09 il aurait garde haMSTR et ANSEMCOIN et ecarte Dukky et
  # CATECOIN, soit +3,55 EUR au lieu de -18,32. Reserve assumee : la tranche au-dessus de 125 ne
  # compte que 22 lancements, et c est elle qui porte l avantage. Revenir a 5 annule le filtre.
  # Abaisse de 125 a 100 le 2026-09-08 apres une heure a 125 sans une seule occasion : le plancher
  # haut ne laissait passer que 1,2 lancement par heure, et l avantage qu il apporte (+0,45 par euro
  # contre +0,36) repose sur 22 lignes contre 34. A 100 le rythme double, 1,9 par heure, et
  # l esperance HORAIRE est meilleure : 1,9 x 0,36 contre 1,2 x 0,45. Le plancher exclut toujours
  # les deux perdants reels du 08/09 (Dukky 91 acheteurs, CATECOIN 86).
  # Ramene de 100 a 75 le 2026-09-08 a 14h : deux heures et demie a 100 pour vingt-quatre
  # lancements juges et zero ticket. Toutes les rejections disaient « acheteurs < 100 », maximum
  # observe 82 : c est notre plancher qui bloquait, pas le marche.
  # Avec le plafond de densite, le plancher 75 rend +0,359 par euro et 69 % de gagnants -- soit
  # exactement ce que donnait le plancher 100 SANS plafond -- pour 40 % de tickets en plus :
  # 1,88 par heure au lieu de 1,38, donc les vingt tickets en onze heures au lieu de quinze.
  min_buyers: 75
  max_trades_per_buyer: 15
  # Plafond de densite, ajoute le 2026-09-08. La densite dit autre chose que le plancher
  # d acheteurs : a plancher egal, garder les lancements sous 600 echanges dans la premiere minute
  # ameliore les quatre mesures d un coup -- 75 % de gagnants contre 69, +0,437 par euro contre
  # +0,348, mediane +0,630 contre +0,459, et +0,371 contre +0,266 une fois le meilleur dixieme
  # retire. Cout : 12 % des occasions, 1,50 par heure au lieu de 1,70. Mettre 0 pour le retirer.
  max_trades_first_minute: 600
  min_liquidity_usd: 0
  # Plafond de capitalisation a l entree, ajoute le 2026-09-08 a 20h40 sur une hypothese de
  # l operateur : un jeton deja gros ne bouge plus assez pour couvrir les frais. Mesure sur 174
  # lancements, et le balayage est MONOTONE, ce qui est ce qui le rend credible :
  #     aucun plafond  51 % gagnants  +0,046 par euro  robustesse -0,005
  #     moins de 100 k 52 %           +0,045           -0,008
  #     moins de  50 k 55 %           +0,088           +0,042
  #     moins de  25 k 59 %           +0,192           +0,155
  # Par tranches : au-dessus de 50 k$ la strategie perd (-0,074 par euro, 50 % de gagnants), en
  # dessous elle gagne (+0,169, 71 %). On retient 50 k et non 25 k : le 25 k mesure mieux mais ne
  # repose que sur 27 lancements, et retenir le meilleur chiffre d un balayage est l erreur du matin.
  # Nos achats du jour avaient des liquidites de 118 k, 223 k, 227 k et jusqu a 1 043 k pour LAPTOP.
  # Mettre 0 pour retirer le plafond.
  max_market_cap_usd: 50000
  max_per_hour: 6
  # Abaisse de 2,0 a 1,5 le 2026-09-08 a 18h, sur nos PROPRES releves et contre le backtest.
  # Le suivi du sommet, ajoute le meme jour, a montre que l objectif de x2 ne s est jamais
  # declenche : sur huit tickets, les sommets plafonnent a x1,82 et les positions redescendent
  # jusqu a l echeance des quinze minutes. Trois lignes sont montees au-dessus de x1,4 puis ont
  # tout rendu -- ZAPE de +57 % a -96 %, NIKEY de +50 % a -14 %.
  #
  # Simulation des objectifs sur ces memes huit lignes, en utilisant les sommets releves toutes
  # les trente secondes par la valeur vendable reelle :
  #     x1,3 -> +5,54    x1,4 -> +11,50    x1,5 -> +17,47    x1,8 -> -18,91    x2,0 -> -46,23
  # Le plateau de x1,3 a x1,5 tient sur les memes trois lignes, ce n est pas un maximum fragile.
  #
  # Le backtest dit l inverse (x2 gagnant sur les quatre criteres, voir §3.22 du journal) mais il
  # porte sur une autre journee et n a jamais vu un objectif se ne declencher jamais. Quand le
  # backtest et le reel se contredisent, le reel gagne : c est la lecon du matin, ou un simulateur
  # annoncait 82 % de gagnants pendant que le livre perdait avec 46 % d invendables.
  #
  # Reserve : huit lignes, dont deux sans sommet mesure. Remettre 2.0 annule.
  take_profit_multiple: 1.5
  # Stop de perte, ajoute le 2026-09-08 a 19h30. Le carnet avait un objectif de gain et une limite
  # de temps, rien pour couper une position qui tombe : DLSS5 tenue jusqu a l echeance pour x0,11,
  # ZAPE pour x0,04, FTFS pour x0,01 apres -99 % en cinq minutes (verifie par le routeur ET par
  # DexScreener, 1 786 ventes contre 513 achats). Environ 40 EUR perdus sur trois lignes qu un stop
  # a -30 % aurait limitees a 6 EUR chacune.
  # Mesure sur les 47 lancements de reference : a objectif egal, le gain par euro passe de +0,123 a
  # +0,183 et la robustesse de +0,079 a +0,147. Seul reglage du jour sur lequel le backtest et le
  # reel concordent. Mettre 0 pour retirer le stop.
  stop_loss_multiple: 0.7
  max_hold_seconds: 900
  sell_slippage_pct: 25.0
  # Plus de plafond de tickets : il arretait aussi une serie gagnante, et de toute facon aucune
  # ligne de code ne le lisait -- il ne protegeait rien. Remplace par une limite de PERTE, qui ne
  # coupe que si ca perd vraiment et laisse courir tant que ca marche. Mettre 0 pour tout enlever.
  max_daily_loss_eur: 100

  # Ecoute des creations de pool en direct, ajoutee le 2026-09-08 apres l abonnement Helius
  # Developpeur. Mesure du jour : la chaine gradue une vingtaine de jetons par heure sur PumpSwap,
  # la decouverte promotionnelle de DexScreener n en montre que 4,3. On en ratait plus des trois
  # quarts, et le rythme est ce qui empeche de savoir si la strategie gagne.
  #
  # Le filtre a ete trouve en capturant quatre migrations et en croisant leurs comptes : le compte
  # 39azUYFW... apparait dans toutes, et croise avec pump.fun il ne rend que 1,3 transaction par
  # minute -- contre 3 780 pour pump.fun seul (45,6 M de credits/mois, hors forfait) et 26 544 pour
  # PumpSwap seul (448 M). Le cout arrondit a zero.
  #
  # La source vient EN PLUS de DexScreener, jamais a sa place : chaque jeton garde la trace de
  # savoir si l autre source l avait aussi, sans quoi on ne pourrait pas mesurer ce qu elle apporte.
  stream:
    enabled: true
    accounts:
      - "6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P"   # programme pump.fun
      - "39azUYFWPz3VHgKCf3VChUwbpURdCHRxjWVowf5jUJjg"  # compte present dans toutes les migrations
    instructions: ["Migrate", "CreatePool", "Initialize2"]
    seconds_per_cycle: 290   # ecoute quasi continue : le volume mesure est nul, les tranches courtes ne servaient qu a pouvoir couper vite
    pause_seconds: 5         # 5 s de trou toutes les 5 min, soit 1,7 % du temps au lieu de 8 %
    max_mb_per_cycle: 30

# Purge de la base. Ajoutee le 2026-09-08 apres que la base a atteint 22,2 Go : la verification
# d integrite qu elle declenche au demarrage a laisse le moteur muet vingt minutes, positions
# ouvertes et Telegram silencieux.
#
# Deux causes, arithmetiques toutes les deux :
#   - la purge supprimait 60 jetons par passage, quatre fois par jour, soit 240, alors que le
#     scanner en decouvre environ 3 400 par jour. Depassee d un facteur quatorze.
#   - elle abandonnait des que le scanner tenait le verrou d ingestion, et les cycles du scanner
#     durent 440 a 594 secondes en s enchainant : elle ne l obtenait quasiment jamais et rendait
#     la main en 0,0 seconde. Elle l attend desormais (voir scheduler.retention_cycle).
#
# Chaque jeton est supprime dans SA PROPRE transaction, donc un lot plus gros allonge le travail
# total sans allonger la duree d un verrou -- c est ce qui rend 500 acceptable la ou 60 ne l etait
# pas. Une purge longue qui verrouille la base avait tue une boucle le 2026-09-08 au matin.
retention:
  prune_interval_seconds: 7200
  max_tokens_per_prune: 500
  scan_tokens_per_prune: 8000
  dead_token_days: 2
  holder_snapshot_days: 7
  pair_snapshot_days: 14
  prune_budget_seconds: 180
