services:
  tangier:
    build:
      context: .
      dockerfile: Dockerfile
    image: tangier-bot:latest
    container_name: tangier-bot
    env_file:
      - .env
    volumes:
      - ./:/app
    working_dir: /app
    tty: true
    stdin_open: true
    command: bash

  intel:
    build:
      context: .
      dockerfile: Dockerfile.intel
    image: tangier-intel:latest
    container_name: tangier-intel
    env_file:
      - .env
    environment:
      # The live SQLite database lives in a container-private volume: a WAL database on a
      # Windows bind mount opened from both sides corrupts. Backups/snapshots (static files)
      # are written to ./data for host-side analysis.
      - INTEL_DB_PATH=/app/db/intel.sqlite
      - INTEL_BACKUP_DIR=/app/data/backups
      - INTEL_LOGS_DIR=/app/logs
      - INTEL_CONFIG=/app/config/intel.yaml
      # La verification d integrite lit tout le fichier. A 22 Go elle prend des dizaines de
      # minutes, pendant lesquelles AUCUNE boucle ne tourne -- ni le negoce ni Telegram. Le
      # 08/09/2026 a 19h51 le moteur est reste muet et le conteneur unhealthy pour cette raison.
      # Une fois par semaine suffit sur une base de cette taille ; la vraie reponse est de la
      # faire maigrir (voir la retention), pas de verifier moins souvent.
      - INTEL_DB_CHECK_HOURS=168
      # Le noeud Robinhood bridait 3,6 % de nos appels (1 049 sur 28 998) le 09/09 vers 2 h, et
      # chaque bridage coute 2,6 a 4 s d attente avant reessai. Cout mesure : 6 s en mediane entre
      # la decision et l ordre sur Robinhood, jusqu a 101 s -- contre 0 s sur Solana. Le limiteur
      # etait a 15 req/s avec des rafales de 15, sur la foi d une mesure du 04/09 disant que le
      # noeud tenait 55 req/s sans erreur ; il ne les tient manifestement plus.
      # Descendu a 10 : la rafale suit le debit, donc c est aussi la rafale qu on abaisse.
      # Critere ecrit d avance : si la part d appels brides ne tombe pas sous 1 % d ici une heure,
      # descendre a 7 ; si elle y tombe, verifier que le delai decision->ordre Robinhood a baisse.
      # Journal §3.32.
      - INTEL_RPC_RPS=10
    volumes:
      - intel_db:/app/db
      - ./data:/app/data
      - ./logs:/app/logs
      - ./results:/app/results
      - ./config/intel.yaml:/app/config/intel.yaml:ro
      # The engine code itself, read-only from the host: a fix lands with a process restart
      # (Telegram /restart, or the restart flag), no rebuild and no recreate. The image still
      # carries a copy for the case where the mount is absent.
      - ./intel:/app/intel:ro
    ports:
      - "8787:8787"
    restart: unless-stopped
    command: ["python", "-m", "intel", "run"]

volumes:
  intel_db:
